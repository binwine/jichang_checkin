name: "Common airport Checkin"

on:
  schedule:
    - cron: "03 00 * * *"  # scheduled at 00:10 (UTC+8) everyday
  workflow_dispatch:

env:
  RUN_ENV: 'prod'

jobs:
  build:
    runs-on: ubuntu-latest
    # if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout master
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # ref: master

      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: 3.10.16

      - name: Random sleep
        if: github.event_name == 'schedule'
        run: sleep $(shuf -i 10-60 -n 1)

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run sign
        env:
          URL: ${{ secrets.URL }}
          # EMAIL 用于企业微信群机器人密钥；登录账号密码仍由 CONFIG 提供。
          EMAIL: ${{ secrets.EMAIL }}
          APPID: ${{ secrets.APPID }}
          APPSECRET: ${{ secrets.APPSECRET }}
          OPENID: ${{ secrets.OPENID }}
          CONFIG: ${{ secrets.CONFIG }}
        run: |
          python3 ./main.py
